<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>bKash Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    font-family: 'Hind Siliguri', sans-serif; 
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #f5f5f5;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 414px;
    margin: 0 auto;
    background: #ffffff;
    position: relative;
  }
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .back-btn {
    font-size: 22px;
    color: #333;
    background: none;
    border: none;
    cursor: pointer;
    line-height: 1;
  }
  .lang-btn {
    border: 1px solid #E2136E;
    color: #E2136E;
    border-radius: 4px;
    padding: 2px 10px;
    font-size: 15px;
    background: none;
    font-weight: 400;
    cursor: pointer;
  }
  .logo {
    width: 45px;
    height: auto;
    margin-bottom: 20px;
    display: block;
  }
  .title {
    font-size: 24px;
    color: #333;
    font-weight: 400;
    line-height: 1.35;
    margin-bottom: 32px;
  }
  .field-label {
    font-size: 13px;
    color: #888;
    margin-bottom: 4px;
    font-weight: 300;
  }
  .field-value {
    font-size: 20px;
    color: #333;
    font-weight: 400;
    padding-bottom: 8px;
    border-bottom: 1px solid #e0e0e0;
    margin-bottom: 28px;
    letter-spacing: 0.5px;
  }
  .pin-dots {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 28px;
    padding-bottom: 8px;
    border-bottom: 1px solid #e0e0e0;
    margin-bottom: 16px;
    position: relative;
    cursor: pointer;
  }
  .pin-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1px solid #999;
    background: transparent;
  }
  .pin-dot.filled {
    background: #E2136E;
    border-color: #E2136E;
  }
  .pin-placeholder {
    font-size: 16px;
    color: #b0b0b0;
    font-weight: 300;
  }
  
  /* Native Keyboard Overlay Fix (Same pattern used in Send Money flow) */
  .hidden-pin-input {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    z-index: 5;
    cursor: pointer;
  }

  .forgot {
    color: #E2136E;
    font-size: 14px;
    text-decoration: none;
    font-weight: 400;
    margin-top: 4px;
  }
  .bottom-section {
    width: 100%;
    margin-top: auto;
  }
  .next-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: #dcdcdc;
    transition: background 0.2s, color 0.2s;
    cursor: pointer;
    border: none;
    width: 100%;
  }
  .next-bar.active {
    background: #E2136E;
    color: #fff;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="content">
    <div class="top-row">
      <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
      <button class="lang-btn">বাং</button>
    </div>

    <img src="assets/birds.png" alt="bKash Logo" class="logo">

    <div class="title">আপনার বিকাশ একাউন্টে<br>লগ ইন করুন</div>

    <div class="field-label">একাউন্ট নাম্বার</div>
    <div class="field-value" id="fixedNumber">+88 01345511989</div>

    <div class="field-label">বিকাশ পিন</div>
    <div class="pin-dots" id="pinDots" onclick="focusPinInput()">
      <span class="pin-placeholder" id="pinPlaceholder">বিকাশ পিন নাম্বার দিন</span>
      <!-- Transparent Full Overlay Input to trigger mobile native numeric keypad -->
      <input type="password" id="realPinInput" class="hidden-pin-input" maxlength="5" inputmode="numeric" oninput="handleNativePinInput(this)">
    </div>

    <a href="#" class="forgot">পিন ভুলে গেছেন? পিন রিসেট করুন</a>
  </div>

  <div class="bottom-section">
    <button class="next-bar" id="nextBar" onclick="trySubmit()">
      <span>পরবর্তী</span>
      <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>
</div>

<script>
  const PIN_LENGTH = 5;
  let pin = "";

  const pinDots = document.getElementById('pinDots');
  const nextBar = document.getElementById('nextBar');
  const realPinInput = document.getElementById('realPinInput');

  function focusPinInput() {
    realPinInput.focus();
  }

  function handleNativePinInput(el) {
    pin = el.value;
    renderPin();
  }

  function renderPin() {
    if (pin.length === 0) {
      pinDots.innerHTML = '<span class="pin-placeholder" id="pinPlaceholder">বিকাশ পিন নাম্বার দিন ল</span><input type="password" id="realPinInput" class="hidden-pin-input" maxlength="5" inputmode="numeric" oninput="handleNativePinInput(this)">';
      // Re-assign reference after innerHTML rebuild
      document.getElementById('realPinInput').value = pin;
      nextBar.classList.remove('active');
      return;
    }
    
    let html = '';
    for (let i = 0; i < PIN_LENGTH; i++) {
      html += '<span class="pin-dot' + (i < pin.length ? ' filled' : '') + '"></span>';
    }
    html += '<input type="password" id="realPinInput" class="hidden-pin-input" maxlength="5" inputmode="numeric" oninput="handleNativePinInput(this)">';
    pinDots.innerHTML = html;

    const currentInput = document.getElementById('realPinInput');
    currentInput.value = pin;
    currentInput.focus();

    if (pin.length === PIN_LENGTH) {
      nextBar.classList.add('active');
    } else {
      nextBar.classList.remove('active');
    }
  }

  function trySubmit() {
    if (pin.length === PIN_LENGTH) {
      window.location.href = "home.html";
    } else {
      alert('দয়া করে ৫ ডিজিটের সঠিক পিন দিন');
      focusPinInput();
    }
  }

  // Auto focus input on page load to invoke native keyboard smoothly
  window.onload = function() {
    focusPinInput();
  };
</script>

</body>
</html>
